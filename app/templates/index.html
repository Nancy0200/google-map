<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Road Bulletin — 即時路況留言板，讓駕駛互相分享路況資訊">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Road Bulletin — 即時路況留言板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=5) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navsim.css', v=5) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/danmaku.css', v=5) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quickbtn.css', v=5) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/copilot-chat.css', v=5) }}">
</head>
<body>
    <div id="app">
        <!-- ===== 全螢幕地圖 ===== -->
        <main id="nav-panel">
            <!-- Navigation simulation map container -->
            <div id="navsim-canvas-wrap">
                <div id="navsim-map" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; background-color: #eef3dc;"></div>
            </div>

            <!-- 彈幕層 -->
            <div id="danmaku-layer"></div>

            <!-- ===== 右上角模擬按鈕 ===== -->
            <button id="sim-start-btn" title="開始導航模擬">
                <span class="sim-btn-icon">▶</span>
                <span class="sim-btn-label">開始模擬</span>
            </button>

            <!-- ===== Legacy Navigation HUD (hidden, for compatibility) ===== -->
            <div id="nav-hud" style="display:none;">
                <div class="hud-road-card">
                    <span class="hud-road-icon">🛣️</span>
                    <span class="hud-road-name" id="hud-road">準備中</span>
                    <span class="hud-km-badge" id="hud-km">0km</span>
                </div>
                <div class="hud-stats">
                    <div class="hud-stat stat-speed">
                        <span class="hud-stat-val"><span id="hud-speed">0</span></span>
                        <span class="hud-stat-label">km/h</span>
                    </div>
                    <div class="hud-stat">
                        <span class="hud-stat-val" id="hud-dist">196.0 km</span>
                        <span class="hud-stat-label">剩餘</span>
                    </div>
                    <div class="hud-stat">
                        <span class="hud-stat-val" id="hud-eta">1時58分</span>
                        <span class="hud-stat-label">到達</span>
                    </div>
                </div>
            </div>

            <!-- ===== Google Maps Style Navigation HUD ===== -->
            <!-- Top: Turn instruction card (green) -->
            <div id="nav-turn-card" class="hidden">
                <div class="turn-card-inner">
                    <div class="turn-icon-wrap">
                        <span id="turn-icon" class="turn-arrow">⬆</span>
                    </div>
                    <div class="turn-info">
                        <div class="turn-dist" id="turn-dist">準備出發</div>
                        <div class="turn-road" id="turn-road">持續直行</div>
                    </div>
                </div>
            </div>

            <!-- Bottom-left: Speed circle -->
            <div id="speed-circle">
                <span id="speed-value" class="speed-num">0</span>
                <span class="speed-unit">km/h</span>
            </div>

            <!-- Bottom: Info bar (white) -->
            <div id="nav-hud-gmap">
                <div class="gmap-bottom-bar">
                    <div class="gmap-info-item gmap-time">
                        <span class="gmap-info-value" id="bottom-time">1 時 58 分</span>
                        <span class="gmap-info-label">剩餘時間</span>
                    </div>
                    <div class="gmap-divider"></div>
                    <div class="gmap-info-item gmap-dist">
                        <span class="gmap-info-value" id="bottom-dist">196.0 公里</span>
                        <span class="gmap-info-label">剩餘距離</span>
                    </div>
                    <div class="gmap-divider"></div>
                    <div class="gmap-info-item gmap-eta">
                        <span class="gmap-info-value" id="bottom-eta">--:--</span>
                        <span class="gmap-info-label">預計到達</span>
                    </div>
                </div>
            </div>

            <!-- ===== 快速回報按鈕區 (左下角) ===== -->
            <div id="quick-btn-area">
                <!-- 主選單按鈕 (最左) -->
                <button id="menu-toggle" title="快速回報">
                    <span class="menu-icon">◉</span>
                </button>

                <!-- 3 個固定快捷鍵 (右側) -->
                <div id="shortcut-slots">
                    <button class="shortcut-btn" data-key="red" title="車速 < 30">
                        <span class="shortcut-icon">🔴</span>
                        <span class="shortcut-label">慢速</span>
                    </button>
                    <button class="shortcut-btn" data-key="accident" title="前方車禍">
                        <span class="shortcut-icon">🚗💥</span>
                        <span class="shortcut-label">車禍</span>
                    </button>
                    <button class="shortcut-btn" data-key="debris" title="前方掉落物">
                        <span class="shortcut-icon">📦⚠️</span>
                        <span class="shortcut-label">掉落物</span>
                    </button>
                </div>

                <!-- 選項面板 (向上展開) -->
                <div id="menu-panel" class="collapsed">
                    <button class="menu-option" data-key="red">
                        <span class="option-icon">🔴</span>
                        <span class="option-label">車速 &lt; 30</span>
                    </button>
                    <button class="menu-option" data-key="yellow">
                        <span class="option-icon">🟡</span>
                        <span class="option-label">車速 30–60</span>
                    </button>
                    <button class="menu-option" data-key="green">
                        <span class="option-icon">🟢</span>
                        <span class="option-label">車速 &gt; 60</span>
                    </button>
                    <button class="menu-option" data-key="accident">
                        <span class="option-icon">🚗💥</span>
                        <span class="option-label">前方車禍</span>
                    </button>
                    <button class="menu-option" data-key="debris">
                        <span class="option-icon">📦⚠️</span>
                        <span class="option-label">前方掉落物</span>
                    </button>
                </div>
            </div>

        </main>

        <!-- 冷卻提示 (移到最外層確保不被遮擋) -->
        <div id="cooldown-toast" class="hidden" style="z-index: 99999;">
            <span id="cooldown-msg">發送過於頻繁，請稍候 <span id="cooldown-sec">0</span> 秒</span>
        </div>

        <!-- ===== 聊天室 Toggle ===== -->
        <button id="copilot-toggle" title="聊天室">
            <span id="copilot-unread" class="hidden"></span>
            <span class="toggle-icon">💬</span>
        </button>

        <!-- ===== 聊天室 (底部面板) -->
        <section id="copilot-panel">
            <header id="copilot-header">
                <div class="chat-avatar">💬</div>
                <div class="chat-info">
                    <div class="chat-title">聊天室</div>
                    <div class="chat-status">即時連線中</div>
                </div>
                <span id="copilot-online-count">1 在線</span>
                <button class="copilot-minimize-btn" id="copilot-minimize" title="縮小聊天室">▾</button>
                <button class="copilot-close-btn" id="copilot-close" title="關閉聊天室">✕</button>
            </header>
            <div id="copilot-messages">
                <div id="copilot-empty">
                    <span class="empty-icon">💬</span>
                    <span class="empty-text">在這裡輸入文字<br>與駕駛分享路況資訊</span>
                </div>
            </div>
            <div id="copilot-typing">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span>有人正在輸入...</span>
            </div>
            <div id="copilot-quick-tags">
                <button class="quick-tag" data-text="前方塞車">🚗 塞車</button>
                <button class="quick-tag" data-text="路況順暢">✅ 順暢</button>
                <button class="quick-tag" data-text="小心前方施工">🚧 施工</button>
                <button class="quick-tag" data-text="注意測速照相">📸 測速</button>
                <button class="quick-tag" data-text="下雨路滑">🌧️ 雨天</button>
            </div>
            <footer id="copilot-input-area">
                <div id="copilot-input-wrapper">
                    <input type="text" id="copilot-input" placeholder="輸入訊息..." maxlength="100" autocomplete="off">
                    <span id="copilot-char-count">0/100</span>
                </div>
                <button id="copilot-send" class="disabled" title="送出訊息">
                    <span class="send-icon">➤</span>
                </button>
            </footer>
        </section>

        <!-- ===== 收起後的展開按鈕 (右側邊緣) ===== -->
        <button id="chat-expand-tab" class="hidden" title="展開聊天室">
            <span class="expand-icon">💬</span>
            <span class="expand-badge" id="expand-badge">0</span>
        </button>
    </div>

    <!-- SocketIO client library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <!-- App modules -->
    <script src="{{ url_for('static', filename='js/speed.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/cooldown.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/filter.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/socket.js', v=5) }}"></script>
    <script src="https://maps.googleapis.com/maps/api/js?v=weekly&libraries=geometry,routes"></script>
    <script src="{{ url_for('static', filename='js/real_route.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/navsim.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/danmaku.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/quickbtn.js', v=5) }}"></script>
    <script src="{{ url_for('static', filename='js/copilot-chat.js', v=5) }}"></script>
    <script>
        document.addEventListener('click', function(e) {
            const sendBtn = e.target.closest('#copilot-send');
            if (sendBtn) {
                console.log('Global listener caught send button click');
                // Ensure the JS is loaded
                if (!window.CopilotChat) {
                    alert('嚴重錯誤：copilot-chat.js 未載入！');
                }
            }
        });
    </script>
</body>
</html>
